version: '3'
services:
  db:
    container_name: ${CONTAINER_NAME}
    image: postgis/postgis:14-3.2
    ports:
      - ${DB_PORT}:5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql/data

  # Disable for now, not used much and will run faster
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
  #     - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
  #   ports:
  #     - "5050:80"

  redis:
    image: redis:latest
    ports:
      - '6389:6379'

  # Row 17 (spec 0039, AC-14): a fake mail server for dev. The backend sends reset codes to it over
  # SMTP on 1025, and you read them in its web inbox at http://localhost:8025. Nothing leaves the machine.
  mailpit:
    container_name: opencourier-mailpit
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
volumes:
  postgres: ~
