version: '3'
services:
  db:
    container_name: ${CONTAINER_NAME}
    image: postgis/postgis:14-3.2
    ports:
      - ${DB_PORT}:5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql/data

  # Disable for now, not used much and will run faster
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
  #     - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
  #   ports:
  #     - "5050:80"

  redis:
    image: redis:latest
    ports:
      - '6389:6379'

  # Row 17 (spec 0039, AC-14): a fake mail server for dev. The backend sends reset codes to it over
  # SMTP on 1025, and you read them in its web inbox at http://localhost:8025. Nothing leaves the machine.
  mailpit:
    container_name: opencourier-mailpit
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
  # Spec 0052 (row 83, slice 2): private file storage for complaint photos. The backend makes the
  # `complaints` bucket at startup (private: no anonymous read); its console is http://localhost:9001.
  # Same service as docker-compose.minio.yml, with the same name, so the two files share one container.
  minio:
    container_name: opencourier-minio
    # Pinned by digest to the image the dev stack runs (RELEASE.2025-09-07T16-13-09Z): `latest` moves.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - 'minio:/data'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
volumes:
  postgres: ~
  minio: ~
